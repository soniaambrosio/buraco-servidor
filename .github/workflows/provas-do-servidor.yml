# .github/workflows/provas-do-servidor.yml — O CI OBRIGATÓRIO DO SERVIDOR
# (OS 54, composto sobre a OS 52-C4 pela OS 54-C4).
#
# O portão deste repositório sempre foi `npm test`. O que faltava era
# OBRIGAÇÃO: rodar dependia de alguém lembrar. Este arquivo transforma a
# lembrança em execução automática, e o veredito em algo que ninguém pode
# fabricar por descuido.
#
# TRÊS DESFECHOS, E SÓ UM É VERDE. No Actions um passo pode falhar, pode NÃO
# executar (removido, comentado, desviado, trocado por um `echo`) e pode ser
# cancelado. Só o primeiro tem cor natural. Por isso as provas escrevem
# EVIDÊNCIA em disco — a saída literal do `npm test` e o código de saída dele —
# e quem dá o veredito é `ci/portao_do_ci.js`, que trata ausência como
# reprovação. Um job onde nada rodou termina VERMELHO, não verde.
#
# A EVIDÊNCIA MORA FORA DA ÁRVORE, em `$RUNNER_TEMP`, e isso não é asseio: a
# guarda de unicidade da OS 52 varre o repositório INTEIRO à procura de um
# segundo servidor, e um log de teste crescendo dentro da árvore entra nessa
# varredura enquanto a suíte ainda roda. Evidência fora da árvore preserva
# aquela proteção intacta, e de quebra mantém o checkout do job idêntico ao
# commit medido.
#
# A OUTRA METADE DA CADEIA mora dentro da suíte: `test/ci_obrigatorio.test.js`
# lê ESTE arquivo e reprova quem o desliga — passo apagado, alvo desviado,
# gatilho removido, checkout removido, veredito rebaixado, piso encolhido. Um
# workflow não consegue guardar a si mesmo, e uma suíte não consegue se obrigar
# a rodar; as duas metades juntas fecham o círculo.
#
# [OS 54-C4] E A METADE DE DENTRO DEIXOU DE SER A AUTORIDADE. A OS 54-R2 provou
# que guarda escrita dentro do conjunto varrido some junto com ele: CI-18,
# CI-19 e CI-19b podiam ser trivializadas ou apagadas — inclusive as três
# juntas — com o portão oficial VERDE. As autoridades passaram a viver fora de
# `test/*.test.js`, e este job as executa como PASSOS PRÓPRIOS, cada um sem
# `if:` e sem `continue-on-error:`:
#
#   * `ci/auditabilidade.js`        — o rastro existe, é sempre publicado, e é
#                                     do que foi julgado;
#   * `ci/inventario_de_execucao.js` — quantos casos CADA arquivo executou e
#                                     aprovou, e quais casos NOMINAIS rodaram;
#   * `ci/portao_do_ci.js`          — o juiz fail-closed da evidência;
#   * `ci/artefato.js`              — a autoridade do artefato produtivo único,
#                                     herdada da OS 52-C4 e preservada aqui.
#
# As quatro se vigiam: o guardião cobra a PRESENÇA das outras três neste
# arquivo, e ele mesmo roda também no `pretest`, então tirá-lo daqui reprova de
# dentro do `npm test`. Nenhuma delas depende de a suíte ter rodado.
#
# NÃO USA SEGREDO NENHUM, e não pode passar a usar: o servidor não tem
# dependência privada, e as suítes sobem tudo em portas locais.

name: Provas do servidor

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Leitura, e só. O job não publica, não implanta e não escreve no repositório.
permissions:
  contents: read

# Sem `cancel-in-progress`: cancelamento é um dos desfechos que este portão
# existe para distinguir, e não faz sentido fabricá-lo por conveniência.
concurrency:
  group: provas-do-servidor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provas:
    name: npm test (portão fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout íntegro
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # DECLARAÇÃO ÚNICA do lugar da evidência, entregue a todos os passos
      # seguintes — inclusive aos `if: always()`, que precisam dela justamente
      # quando o passo anterior não chegou ao fim. Uma variável de shell não
      # sobreviveria de um `run:` para o outro, e duas cópias do caminho seriam
      # duas verdades.
      #
      # POR QUE AQUI, E NÃO NO `env:` DO JOB: o contexto `runner` só existe a
      # partir dos passos. Declarado no job, o workflow nem chega a criar job —
      # falha na validação, e um portão que não roda não guarda nada.
      - name: Lugar da evidência
        run: echo "EVIDENCIA=$RUNNER_TEMP/evidencia" >> "$GITHUB_ENV"

      - name: Node em versão explícita
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Node e npm de fato usados
        run: |
          node --version
          npm --version

      - name: Dependências pelo mecanismo canônico do repositório
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      # O ALVO OFICIAL, e nada além dele. A saída inteira vai para a evidência,
      # e o código de saída é gravado num marcador próprio — é ele que separa
      # "falhou" de "nem chegou a terminar".
      - name: Provas oficiais do servidor
        run: |
          mkdir -p "$EVIDENCIA"
          set +e
          npm test > "$EVIDENCIA/npm-test.txt" 2>&1
          codigo=$?
          set -e
          printf '%s' "$codigo" > "$EVIDENCIA/exit.txt"
          cat "$EVIDENCIA/npm-test.txt"

      # [OS 54-C4] O GUARDIÃO DO RASTRO. Roda aqui E no `pretest`, e é ele que
      # responde se o run publica rastro legível — do que foi julgado, e não de
      # outra coisa. Guarda que morava dentro da suíte protegida some junto com
      # ela; esta não mora. É também quem percebe se a autoridade do artefato
      # produtivo sair desta lista de passos.
      - name: Guardião da auditabilidade
        run: node ci/auditabilidade.js

      # [OS 54-C4] A AUTORIDADE DE QUANTIDADE. Executa as suítes obrigatórias
      # pelo stream de eventos do `node:test` e conta por ARQUIVO DE ORIGEM —
      # caso apagado não emite evento, caso comentado não emite evento, e caso
      # movido para um arquivo-isca aparece com outra origem. É ela que cobra os
      # casos NOMINAIS, inclusive os da autoridade do artefato.
      - name: Inventário por execução
        run: node ci/inventario_de_execucao.js

      # O VEREDITO. Sem `if:`, sem tolerância a erro: se este passo não rodar,
      # o job não fica verde por conta própria — e se rodar, é ele quem decide.
      - name: Portão fail-closed
        run: node ci/portao_do_ci.js "$EVIDENCIA/npm-test.txt" "$EVIDENCIA/exit.txt"

      # [OS 52-C4] A AUTORIDADE DO ARTEFATO PRODUTIVO, num passo próprio.
      #
      # Roda DEPOIS do juiz, sem `if:` e sem `continue-on-error:`: se este passo
      # não rodar, o job não fica verde por conta própria; se rodar, é ele quem
      # diz se o que seria implantado é exatamente `server.js` e `package.json`.
      #
      # Passo PRÓPRIO, e não uma linha dentro do `npm test`, pelo mesmo motivo
      # que o juiz é um passo próprio: quem estreita o glob desliga tudo o que
      # vive dentro dele. Aqui a conferência não depende do que a suíte fez.
      #
      # Precisa do histórico, e o tem: o checkout é `fetch-depth: 0`, e o
      # conjunto produtivo é comparado contra `HEAD`, `HEAD^` e a base medida.
      - name: Artefato produtivo único
        run: node ci/artefato.js --conferir --raiz .

      - name: Resumo (verde, vermelho, cancelado ou não executado)
        if: always()
        run: |
          node ci/portao_do_ci.js --resumo "$EVIDENCIA/npm-test.txt" "$EVIDENCIA/exit.txt" \
            --desfecho "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Evidência arquivada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-provas-do-servidor
          path: ${{ env.EVIDENCIA }}/
          if-no-files-found: error
          retention-days: 30
